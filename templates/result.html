<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SCRIPT_NAME%</title>
    <style>
        *,
        *:before,
        *:after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            --bg-color: #090f1e;
            --bg-color-dark: #0e0e0e;
            --bg-color-light: #15213e;
            --fg-color: #e6e6e6;
            --fg-color-dark: #d5d5d5;
            --btn-color: #2e71be;
            --btn-hover-color: #175081;
            --copied-color: #318f2c;
        }

        body {
            font-family: monospace;
            background-color: var(--bg-color-dark);
            color: var(--fg-color);
            line-height: 1.7;
            font-size: 17px;
            display: flex;
            flex-direction: column;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: center;
        }

        /* ---------------------- */
        a {
            text-decoration: none;
            color: var(--btn-color);
        }

        .separator {
            margin: 0.5rem 0;
            height: 2px;
            background-color: #fff;
        }

        footer {
            padding: 1rem 0;
            font-size: x-small;
            color: var(--fg-color-dark);
        }

        /* ---------------------- */
        .result_wrapper {
            min-width: 800px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 0.7rem;
            color: var(--fg-color-dark);
        }

        /* ---------------------- */
        .result_wrapper .result_top {
            background-color: #000;
            padding: 0;
        }

        /* ---------------------- */
        .result_header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
            gap: 1rem;
        }

        .result_header .course_name_txt {
            text-overflow: ellipsis;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            border: 3px dotted transparent;
            text-align: start;
            color: #dddddd;
            padding: 0.5rem 0;
            overflow: hidden;
            white-space: nowrap;
            margin: 0.4rem 0;
            cursor: pointer;
        }

        .result_header .course_name_txt:hover {
            border: 3px dotted #cecece;
        }

        .result_header_actions {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 1rem;
            justify-content: flex-end;
        }

        .result_header_actions button {
            font-family: inherit;
            background-color: #bebebe;
            color: #3e3e3e;
            padding: 0.3rem;
            border: none;
            cursor: pointer;
        }

        .result_header_actions button:hover {
            text-decoration-color: #3e3e3e;
            background-color: #dedede;
            color: #3e3e3e;
            text-underline-offset: 5px;
            text-decoration: dashed;
            text-decoration-line: underline;
            text-decoration-color: #3e3e3e;
        }

        /* ---------------------- */
        .result_info {
            width: 100%;
            font-size: small;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .result_info .info_details {
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: center;
            gap: 2rem;
            color: #8a909d;
        }

        /* ---------------------- */
        .data_header {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
            gap: 1rem;
            color: #818181;
            font-size: small;
        }

        .data_header .title,
        .data_header .duration {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
        }

        .data_header .title {
            min-width: 85%;
        }

        .data_header .duration {
            min-width: 15%;
        }

        .data_header p {
            width: 100%;
        }

        /* ---------------------- */
        .result_body {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
            gap: 0.8rem;
        }

        .result_body .single_data_section {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: stretch;
            gap: 1rem;
        }

        .result_body .course_section {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 1rem;
            align-items: stretch;
        }

        .result_body .single_data_section .title,
        .result_body .single_data_section .duration {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            cursor: pointer;
        }

        .result_body .single_data_section .title {
            width: 85%;
        }

        .result_body .single_data_section .duration {
            width: 15%;
            text-align: center;
        }

        .result_body .single_data_section .txt {
            width: 100%;
            border: 3px dotted #999;
            color: var(--fg-color-dark);
            padding: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .result_body .section .title {
            background-color: #373737;
            font-weight: bold;
        }

        .result_body .section .duration {
            background-color: #373737;
        }

        .result_body .single_data_section .title:hover>.txt,
        .result_body .single_data_section .duration:hover>.txt {
            background-color: #1c1c1c;
            border-color: #fff;
        }

        .txt-copied {
            width: 100%;
            border: 3px dotted var(--copied-color) !important;
            color: var(--copied-color) !important;
            padding: 0.5rem;
            overflow: hidden !important;
            text-overflow: ellipsis !important;
            white-space: nowrap !important;
        }

        .txt-copied:hover {
            background-color: #1c1c1c;
            border-color: var(--copied-color);
        }
    </style>
</head>

<body>

    <section class="result_wrapper">

        <div class="result_top">

            <section class="result_header">

                <div style="width: 100%;">
                    <p style="font-size: 12px; padding: 0; margin: 0; color:#8a909d;">The following Udemy Course has
                        Successfully Scraped</p>
                    <p class="course_name_txt" onclick="copy_text(this)">
                        %COURSE_NAME%</p>
                </div>

            </section>



            <div class="result_info">

                <div class="info_details">

                    <p>
                        <strong>Sections:</strong>
                        %TOTAL_SECTIONS%
                    </p>

                    <p>
                        <strong>Lectures:</strong>
                        %TOTAL_LECTURES%
                    </p>

                    <p>
                        <strong>Duration:</strong>
                        %TOTAL_DURATION%
                    </p>

                    <p>
                        <strong>Course:</strong>
                        <a href="%SCRAPING_URL%" target="_blank">
                            Course Link
                        </a>
                    </p>

                </div>

            </div>


        </div>

        <div class="result_header_actions">

            <button id="toggle-lectures-btn" onclick="toggle_lectures()">
                Toggle Lectures
            </button>

        </div>

        <div class="separator"></div>

        <div class="data_header">

            <div class="title">
                <p>Title</p>
            </div>

            <div class="duration">
                <p>Duration</p>
            </div>

        </div>

        <div class="result_body">

            %ALL_DATA%

        </div>

    </section>

    <footer>

        <p>
            Made by
            <a href="https://github.com/kareemaboueid" target="_blank">
                Kareem Aboueid
            </a>
        </p>

    </footer>

    <script>function copy_text(e) { const t = e.textContent; navigator.clipboard.writeText(t).then(() => { e.classList.remove("txt"), e.classList.add("txt-copied") }) } function save_to_file() { const e = `${document.querySelector(".info_details p strong + a").textContent.replace(/[^a-zA-Z0-9]/g, "_").replace(/_+/g, "_").replace(/^_+|_+$/g, "").toLowerCase().replace(/_/g, "-")}.txt`, t = document.querySelectorAll(".single_data_section"); let n = ""; const o = document.querySelector("#scraping_time").textContent.trim(), c = document.querySelector(".info_details p:nth-child(3)").textContent.trim(), r = document.querySelector(".info_details a").textContent.trim().replace(/\s+/g, " "); n += `Time: ${o}s\n`, n += `${c}\n`, n += `Course: ${r}\n`, n += "||||||||||||||||||||||||||||||||||||||\n\n", t.forEach(e => { const t = e.querySelector(".title p").textContent.trim().replace(/\n/g, " ").replace(/\s+/g, " "), o = e.querySelector(".duration p").textContent.trim(); n += `${t}\n${o.replace(" minutes", "")}\n\n` }); const l = new Blob([n], { type: "text/plain" }), i = document.createElement("a"); i.href = URL.createObjectURL(l), i.download = e, document.body.appendChild(i), i.click(), document.body.removeChild(i) } function toggle_lectures() { const e = document.querySelectorAll(".section_lectures"), t = document.getElementById("toggle-lectures-btn"), n = "Hide Lectures" === t.innerText; e.forEach(e => { e.style.display = n ? "none" : "block" }), t.innerText = n ? "Show Lectures" : "Hide Lectures" }
    </script>
</body>

</html>
